services:

  # ── LLM: Gemma 4 31B (multimodal) en la iGPU Radeon 8060S (gfx1151) ──────────
  # Modelo GATED: requiere HUGGING_FACE_HUB_TOKEN en ../.env y aceptar la licencia
  # de Gemma en su página de HuggingFace. BF16 (~61 GiB de pesos); sin FP8.
  # Parsers gemma4 para razonamiento y tool-calling (igual que en server0).
  # Puerto externo 8003. Modelo servido como "gemma-4-31b".
  # ─────────────────────────────────────────────────────────────────────────────
  vllm-llm:
    image: docker.io/kyuz0/vllm-therock-gfx1151:latest
    container_name: vllm-gemma-4-31b
    entrypoint: ["vllm", "serve"]
    command:
      # ⚠️ Para chat + tools conviene la variante INSTRUCT. Si existe en HF, usa
      # "google/gemma-4-31B-it" en vez de la base. Verifica el nombre exacto.
      - google/gemma-4-31B-it
      - --served-model-name
      - gemma-4-31b
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "4"
      # ~61 GiB de pesos + KV; si da OOM, baja a 0.70.
      - --gpu-memory-utilization
      - "0.75"
      - --trust-remote-code
      # ⚠️ La torre de VISIÓN de Gemma 4 (imagen Y video) crashea en gfx1151
      # (hipErrorInvalidValue en el layernorm del encoder, código de transformers).
      # Desactivamos ambas → Gemma corre SOLO TEXTO (que sí usa el path nativo de
      # vLLM y funciona). Para multimodal en esta EVO usa Qwen3.8-27B.
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
      # Razonamiento + tool calling (formato Gemma 4, como en server0):
      - --reasoning-parser
      - gemma4
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      # Opcional: activar "thinking" por defecto en todas las peticiones.
      - --default-chat-template-kwargs
      - '{"enable_thinking": true}'
    ports:
      - "8000:8000"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    ipc: host
    shm_size: "16g"
    environment:
      - "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
    # Token HF OBLIGATORIO aquí (modelo gated): crea ../.env con HUGGING_FACE_HUB_TOKEN.
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    env_file:
      - path: ../.env
        required: true
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 600s
    restart: unless-stopped

volumes:
  hf-cache:
    name: vllm-hf-cache
